<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Learning Cards</title>
	<style>
		:root {
			--bg: #fafafa; --card: #fff; --text: #222; --muted: #666;
			--line: #ddd; --accent: #2563eb; --code: #f0f0f0;
		}
		@media (prefers-color-scheme: dark) {
			:root { --bg: #111; --card: #1c1c1c; --text: #eee; --muted: #999; --line: #333; --accent: #60a5fa; --code: #2a2a2a; }
		}
		body {
			margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
		}
		main { max-width: 640px; margin: 0 auto; }
		h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 .25rem; }
		.muted { color: var(--muted); margin: 0; }
		code { background: var(--code); padding: 0 .25em; border-radius: 4px; font-size: .9em; }
		a { color: var(--accent); }

		#filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
		#filters button, .grade button {
			font: inherit; padding: 6px 14px; border-radius: 999px; cursor: pointer;
			border: 1px solid var(--line); background: var(--card); color: var(--text);
		}
		#filters button.active { border-color: var(--accent); color: var(--accent); }

		/* Both faces sit in the same grid cell, so the card is as tall as its longer side. */
		.card { perspective: 1200px; cursor: pointer; }
		.inner { display: grid; transition: transform .5s; transform-style: preserve-3d; }
		.card.flipped .inner { transform: rotateY(180deg); }
		.face {
			grid-area: 1 / 1; backface-visibility: hidden; min-height: 220px; box-sizing: border-box;
			padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
		}
		.back { transform: rotateY(180deg); }
		.tag { font-size: .8rem; color: var(--muted); margin: 0 0 12px; }
		.question { font-size: 1.25rem; font-weight: 500; margin: 0; }

		.grade { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
		.grade[hidden] { display: none; }
		#status { text-align: center; margin-top: 16px; font-size: .9rem; }
	</style>
</head>
<body>
	<main>
		<h1>Learning cards</h1>
		<p class="muted">Questions on the ideas behind my <a href="https://github.com/jonastheiler">projects</a>. Click a card to see the answer.</p>

		<div id="filters"></div>

		<div class="card" id="card" tabindex="0">
			<div class="inner">
				<div class="face front">
					<p class="tag" id="front-tag"></p>
					<p class="question" id="question"></p>
				</div>
				<div class="face back">
					<p class="tag" id="back-tag"></p>
					<p id="answer"></p>
					<a id="link" target="_blank" rel="noopener">See it in the code →</a>
				</div>
			</div>
		</div>

		<div class="grade" id="grade" hidden>
			<button id="again">Again</button>
			<button id="knew">Knew it</button>
		</div>
		<p class="muted" id="status"></p>
	</main>

	<script src="cards.js"></script>
	<script>
		// Leitner boxes: a card starts in box 1, moves up one box when you know it and back
		// to box 1 when you don't. The next card always comes from the lowest box, so the
		// cards you struggle with come back most often. Progress is kept in this browser only.
		const BOXES = 5;
		const KEY = "leitner";  // localStorage key; cards are identified by their question

		let boxes = {};
		try { boxes = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}

		let repo = null;  // null shows all repos
		let current = null;

		const $ = id => document.getElementById(id);

		function save() {
			try { localStorage.setItem(KEY, JSON.stringify(boxes)); } catch {}
		}

		function box(card) {
			return boxes[card.q] || 1;
		}

		function deck() {
			return CARDS.filter(c => repo === null || c.repo === repo);
		}

		// Escape the text, then turn `backticks` into <code>.
		function format(text) {
			const div = document.createElement("div");
			div.textContent = text;
			return div.innerHTML.replace(/`([^`]+)`/g, "<code>$1</code>");
		}

		function pick() {
			const cards = deck();
			const lowest = Math.min(...cards.map(box));
			let candidates = cards.filter(c => box(c) === lowest);
			// Don't show the same card twice in a row if there is another one.
			if (candidates.length > 1) candidates = candidates.filter(c => c !== current);
			return candidates[Math.floor(Math.random() * candidates.length)];
		}

		function show(card) {
			current = card;
			$("card").classList.remove("flipped");
			$("grade").hidden = true;
			const tag = `${card.repo} · box ${box(card)} of ${BOXES}`;
			$("front-tag").textContent = tag;
			$("back-tag").textContent = tag;
			$("question").innerHTML = format(card.q);
			$("answer").innerHTML = format(card.a);
			$("link").href = card.link;
			const cards = deck();
			const learned = cards.filter(c => box(c) === BOXES).length;
			$("status").textContent = `${cards.length} cards · ${learned} in the top box`;
		}

		function flip() {
			$("card").classList.toggle("flipped");
			$("grade").hidden = !$("card").classList.contains("flipped");
		}

		function grade(knew) {
			boxes[current.q] = knew ? Math.min(box(current) + 1, BOXES) : 1;
			save();
			show(pick());
		}

		function renderFilters() {
			const repos = [...new Set(CARDS.map(c => c.repo))];
			const options = [[null, `All (${CARDS.length})`],
				...repos.map(r => [r, `${r} (${CARDS.filter(c => c.repo === r).length})`])];
			$("filters").replaceChildren(...options.map(([value, label]) => {
				const button = document.createElement("button");
				button.textContent = label;
				button.classList.toggle("active", value === repo);
				button.onclick = () => { repo = value; renderFilters(); show(pick()); };
				return button;
			}));
		}

		$("card").onclick = event => { if (event.target.tagName !== "A") flip(); };
		$("card").onkeydown = event => {
			if (event.key === " " || event.key === "Enter") { event.preventDefault(); flip(); }
		};
		$("again").onclick = () => grade(false);
		$("knew").onclick = () => grade(true);

		renderFilters();
		show(pick());
	</script>
</body>
</html>
